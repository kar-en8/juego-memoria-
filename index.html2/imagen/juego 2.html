<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f2f2;
    }

    h1 {
        margin-top: 20px;
    }

    #timer {
        font-size: 20px;
        margin: 10px;
    }

    .game-board {
        display: grid;
        grid-template-columns: repeat(4, 100px);
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    .card {
        width: 100px;
        height: 100px;
        background: #333;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s;
    }

    .card.flip {
        transform: rotateY(180deg);
    }

    .card img {
        width: 100%;
        height: 100%;
        position: absolute;
        backface-visibility: hidden;
    }

    .front {
        transform: rotateY(180deg);
    }

    .back {
        background: #555;
    }

</style>
</head>
<body>

<h1>Juego de Memoria</h1>
<div id="timer">Tiempo: 0 s</div>

<div class="game-board" id="gameBoard"></div>

<script>
const images = [
    "imagen/img1.jpg.jpg",
    "imagen/img2.jpg.jpg",
    "imagen/img3.jpg.jpg",
    "imagen/img4.jpg.jpg",
    "imagen/img1.jpg.jpg",
    "imagen/img2.jpg.jpg",
    "imagen/img3.jpg.jpg",
    "imagen/img4.jpg.jpg"
];

// Mezclar cartas
images.sort(() => 0.5 - Math.random());

const board = document.getElementById("gameBoard");

let firstCard = null;
let secondCard = null;
let lock = false;
let matches = 0;

// Temporizador
let time = 0;
setInterval(() => {
    time++;
    document.getElementById("timer").textContent = "Tiempo: " + time + " s";
}, 1000);

// Crear cartas
images.forEach(src => {
    const card = document.createElement("div");
    card.classList.add("card");

    const front = document.createElement("img");
    front.src = src;
    front.classList.add("front");

    const back = document.createElement("img");
    back.src = "https://via.placeholder.com/100";
    back.classList.add("back");

    card.appendChild(front);
    card.appendChild(back);

    card.addEventListener("click", () => {
        if (lock || card === firstCard) return;

        card.classList.add("flip");

        if (!firstCard) {
            firstCard = card;
        } else {
            secondCard = card;
            lock = true;

            if (firstCard.querySelector(".front").src === secondCard.querySelector(".front").src) {
                matches++;
                reset();

                if (matches === 4) {
                    setTimeout(() => {
                        alert("¡Ganaste en " + time + " segundos!");
                    }, 300);
                }

            } else {
                setTimeout(() => {
                    firstCard.classList.remove("flip");
                    secondCard.classList.remove("flip");
                    reset();
                }, 800);
            }
        }
    });

    board.appendChild(card);
});

function reset() {
    [firstCard, secondCard] = [null, null];
    lock = false;
}
</script>

</body>
</html>
